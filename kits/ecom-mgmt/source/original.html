  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-ui, sans-serif; -webkit-font-smoothing: antialiased; }\n  a { color: var(--accent); text-decoration: none; }\n  a:hover { color: var(--accent-strong); }\n  .mono { font-family: 'IBM Plex Mono', monospace; font-feature-settings: 'tnum'; }\n  input, select, button, textarea { font-family: inherit; }\n  [data-theme=\"light\"] {\n    --bg:#efefef; --surface:#ffffff; --surface-2:#f6f6f7; --surface-3:#eeeef0;\n    --side:#e9e9ea; --side-hover:#e0e0e2; --side-active:#dcdcde;\n    --border:#e5e5e9; --border-soft:#eeeef1;\n    --text:#17171c; --text-dim:#5d5d68; --text-mute:#9a9aa6;\n    --accent:#5b4bd6; --accent-strong:#4a3cc0; --accent-weak:#eeecfb; --accent-ink:#ffffff;\n    --grad:linear-gradient(120deg,#6a4be0,#5039cf);\n    --shadow-card:0 1px 2px rgba(20,20,40,.04), 0 6px 20px rgba(20,20,40,.05);\n    --shadow-pill:0 1px 3px rgba(20,20,40,.1), 0 4px 12px rgba(20,20,40,.08);\n  }\n  [data-theme=\"dark\"] {\n    --bg:#0c0c0f; --surface:#16161a; --surface-2:#1c1c22; --surface-3:#23232a;\n    --side:#131317; --side-hover:#1e1e24; --side-active:#26262e;\n    --border:#2a2a32; --border-soft:#212128;\n    --text:#f1f1f5; --text-dim:#a3a3af; --text-mute:#6b6b78;\n    --accent:#8b7bff; --accent-strong:#a79bff; --accent-weak:#221f3a; --accent-ink:#0c0c0f;\n    --grad:linear-gradient(120deg,#7059 f2,#5b47e6);\n    --grad:linear-gradient(120deg,#7059f2,#5b47e6);\n    --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.32);\n    --shadow-pill:0 2px 10px rgba(0,0,0,.5);\n  }\n  ::-webkit-scrollbar { width: 10px; height: 10px; }\n  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }\n  ::-webkit-scrollbar-thumb:hover { background: var(--text-mute); background-clip: padding-box; }\n  @keyframes drawerIn { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }\n  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }\n  @keyframes rowIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div data-theme=\"{{ theme }}\" style=\"--accent:{{ accent }}; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); overflow:hidden\">\n\n  <!-- AUTH -->\n  <sc-if value=\"{{ showAuth }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"position:fixed; inset:0; overflow-y:auto; background:var(--bg); display:flex; z-index:10\">\n    <div style=\"flex:1; display:flex; align-items:center; justify-content:center; padding:32px 24px\">\n      <form sc-camel-on-submit=\"{{ submitAuth }}\" style=\"width:100%; max-width:400px; display:flex; flex-direction:column; gap:18px\">\n        <div style=\"display:flex; align-items:center; gap:10px\">\n<img src=\"717aad20-80c3-463b-b584-3bfef611b9cf\" alt=\"logo\" style=\"width:38px; height:38px; border-radius:11px; object-fit:contain\">\n          <span style=\"font-weight:800; font-size:21px; letter-spacing:-.02em\">{{ brand }}<\u002Fspan>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:26px; font-weight:800; letter-spacing:-.02em\">{{ authTitle }}<\u002Fdiv>\n          <div style=\"font-size:13.5px; color:var(--text-mute); margin-top:6px\">{{ authSubtitle }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ isSignUp }}\" hint-placeholder-val=\"\">\n          <label style=\"display:flex; flex-direction:column; gap:6px\">\n            <span style=\"font-size:13px; font-weight:700; color:var(--text-dim)\">Full name<\u002Fspan>\n            <input value=\"{{ auth.name }}\" sc-camel-on-input=\"{{ setAuthName }}\" placeholder=\"Amara Reyes\" style=\"border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:10px; padding:11px 13px; font-size:14px; outline:none\">\n          <\u002Flabel>\n        <\u002Fsc-if>\n        <label style=\"display:flex; flex-direction:column; gap:6px\">\n          <span style=\"font-size:13px; font-weight:700; color:var(--text-dim)\">Email address<\u002Fspan>\n          <input type=\"email\" value=\"{{ auth.email }}\" sc-camel-on-input=\"{{ setAuthEmail }}\" placeholder=\"you@store.com\" style=\"border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:10px; padding:11px 13px; font-size:14px; outline:none\">\n        <\u002Flabel>\n        <label style=\"display:flex; flex-direction:column; gap:6px\">\n          <span style=\"font-size:13px; font-weight:700; color:var(--text-dim)\">Password<\u002Fspan>\n          <input type=\"password\" value=\"{{ auth.password }}\" sc-camel-on-input=\"{{ setAuthPassword }}\" placeholder=\"••••••••\" style=\"border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:10px; padding:11px 13px; font-size:14px; outline:none\">\n        <\u002Flabel>\n        <sc-if value=\"{{ isSignUp }}\" hint-placeholder-val=\"\">\n          <label style=\"display:flex; flex-direction:column; gap:6px\">\n            <span style=\"font-size:13px; font-weight:700; color:var(--text-dim)\">Confirm password<\u002Fspan>\n            <input type=\"password\" value=\"{{ auth.confirm }}\" sc-camel-on-input=\"{{ setAuthConfirm }}\" placeholder=\"••••••••\" style=\"border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:10px; padding:11px 13px; font-size:14px; outline:none\">\n          <\u002Flabel>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ auth.error }}\" hint-placeholder-val=\"\">\n          <div style=\"font-size:13px; font-weight:600; color:#dc2626; background:rgba(239,68,68,.1); border-radius:9px; padding:10px 12px\">{{ auth.error }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <button type=\"submit\" style=\"border:none; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:14.5px; padding:13px; border-radius:11px; cursor:pointer\">{{ authCta }}<\u002Fbutton>\n        <div style=\"text-align:center; font-size:13.5px; color:var(--text-mute)\">{{ authSwitchLabel }} <a href=\"#\" sc-camel-on-click=\"{{ switchAuth }}\" style=\"font-weight:700\">{{ authSwitchCta }}<\u002Fa><\u002Fdiv>\n      <\u002Fform>\n    <\u002Fdiv>\n    <div style=\"flex:1; display:{{ authPanelDisplay }}; flex-direction:column; justify-content:center; gap:22px; background:var(--grad); color:#fff; padding:60px\">\n      <div style=\"font-size:34px; font-weight:800; letter-spacing:-.02em; line-height:1.15; max-width:420px\">Run your whole store from one console.<\u002Fdiv>\n      <div style=\"font-size:14.5px; opacity:.88; max-width:380px; line-height:1.6\">Orders, inventory, purchases, reports and dropshipping — {{ brand }} keeps every part of your business in sync.<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:14px; margin-top:8px\">\n        <sc-for list=\"{{ authBullets }}\" as=\"b\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex; align-items:center; gap:12px\"><span style=\"width:30px; height:30px; border-radius:9px; background:rgba(255,255,255,.16); display:grid; place-items:center; flex:none\"><i class=\"hgi-stroke hgi-{{ b.icon }}\" style=\"font-size:16px\"><\u002Fi><\u002Fspan><span style=\"font-size:14px; font-weight:600\">{{ b.label }}<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ authed }}\" hint-placeholder-val=\"\">\n  <!-- TOP NAV -->\n  <header style=\"height:60px; flex:none; background:#0d0d10; color:#fff; display:flex; align-items:center; gap:{{ hdrGap }}; padding:0 18px; z-index:50\">\n    <button sc-camel-on-click=\"{{ toggleMobileNav }}\" style=\"display:{{ hdrHamburgerDisplay }}; width:38px; height:38px; flex:none; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06); border-radius:10px; cursor:pointer; color:#fff; place-items:center\">\n      <i class=\"hgi-stroke hgi-menu-01\" style=\"font-size:19px\"><\u002Fi>\n    <\u002 rder-radius:20px; background:{{ c.bg }}; color:{{ c.fg }}\">{{ c.v }}<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ c.isSub }}\" hint-placeholder-val=\"\">\n              <span style=\"text-align:right\"><span style=\"display:block; font-size:13.5px; font-weight:700\">{{ c.v }}<\u002Fspan><span style=\"display:block; font-size:11.5px; color:var(--text-mute)\">{{ c.sub }}<\u002Fspan><\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ c.isText }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"font-size:13.5px; font-weight:{{ c.w }}; font-family:{{ c.ff }}; color:{{ c.color }}; text-align:right\">{{ c.v }}<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:900},&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:[&quot;#5b4bd6&quot;,&quot;#12b886&quot;,&quot;#2563eb&quot;,&quot;#f97316&quot;,&quot;#0f0f0f&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;brandName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Rubik&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Store&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    theme: null, view: 'orders.all',\n    openGroups: null, selectedOrderId: null,\n    tabState: {}, listQuery: '', searchOpen: false, page: 1, pageSize: 10,\n    lowOnly: false,\n    store: { theme:'Aria', device:'desktop', published:true, accent:'#5b4bd6' },\ ;\n      const low=D.products.filter(p=>p.stock<=p.threshold);\n      out.kpis=[\n        {label:'Total revenue',icon:'wallet-01',value:this.money(revenue),delta:'+12.4%',deltaColor:'#0ca678'},\n        {label:'Orders',icon:'shopping-cart-01',value:String(D.orders.length),delta:'+8.1%',deltaColor:'#0ca678'},\n        {label:'Avg order value',icon:'tag-02',value:this.money(revenue/Math.max(active.length,1)),delta:'+3.7%',deltaColor:'#0ca678'},\n        {label:'Low stock SKUs',icon:'alert-02',value:String(low.length),delta:'-2 today',deltaColor:'#dc2626'},\n      ];\n      out.revChart = (()=>{\n        const ratios=[0.42,0.55,0.48,0.66,0.5,0.72,0.8,1];\n        const vals=ratios.map(r=>Math.round(revenue*r/100)*100);\n        const w=700,h=180,padX=14,padY=10;\n        const max=Math.max(...vals)*1.12;\n        const x=i=>padX+i*(w-2*padX)/(vals.length-1);\n        const y=v=>h-padY-(v/max)*(h-2*padY);\n        const pts=vals.map((v,i)=>({x:x(i),y:y(v),v}));\n        let line=`M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;\n        for(let i=0;i<pts.length-1;i++){ const p0=pts[i],p1=pts[i+1]; const mx=((p0.x+p1.x)/2).toFixed(1);\n          line+=` C ${mx} ${p0.y.toFixed(1)}, ${mx} ${p1.y.toFixed(1)}, ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`; }\n        const area=`${line} L ${pts[pts.length-1].x.toFixed(1)} ${h-padY} L ${pts[0].x.toFixed(1)} ${h-padY} Z`;\n        const grid=[1,0.75,0.5,0.25,0].map(f=>{ const v=Math.round(max*f); return { label: v>=1000? this.money(v/1000,0)+'K' : this.money(v) }; });\n        const b1=pts[2], b2=pts[6];\n        const bubbles=[\n          { left:(b1.x/w*100).toFixed(1)+'%', top:(b1.y/h*100).toFixed(1)+'%', value:this.money(b1.v) },\n          { left:(b2.x/w*100).toFixed(1)+'%', top:(b2.y/h*100).toFixed(1)+'%', value:this.money(b2.v) },\n        ];\n        return { total:this.money(revenue), delta:'+12.4%', area, line, grid, bubbles, months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'] };\n      })();\n\n      out.custDonut = (()=>{\n        const dist=[\n          {label:'Repeat Buyers', pct:45, color:'var(--accent)'},\n          {label:'New Customers', pct:35, color:'#f0b429'},\n          {label:'Wholesale', pct:20, color:'#c7bff5'},\n        ];\n        let cum=0; const gap=2;\n        const segs=dist.map(d=>{\n          const midPct=cum+d.pct/2;\n          const theta=(midPct/100*360-90)*Math.PI/180;\n          const lx=(100+92*Math.cos(theta)).toFixed(1), ly=(100+92*Math.sin(theta)).toFixed(1);\n          const seg={...d, pctLabel:d.pct+'%', dasharray:`${Math.max(d.pct-gap,0)} 100`, dashoffset:(-cum).toFixed(2), lx, ly};\n          cum+=d.pct; return seg;\n        });\n        return { segs, total:'5,012' };\n      })();\n\n      const sold=[128,89,74,69,65,58];\n      const topProds=D.products.slice(0,6).map((p,i)=>({ name:p.name, amount:p.price*(sold[i]||40) }));\n      const maxAmt=Math.max(...topProds.map(p=>p.amount))*1.15;\n      const totalAmt=topProds.reduce((a,p)=>a+p.amount,0);\n      out.topSellingChart = {\n        total:this.money(totalAmt), delta:'+9.6%',\n        avgPct:((totalAmt/topProds.length)/maxAmt*100).toFixed(1)+'%',\n        bars: topProds.map(p=>({ label:p.name.split(' ')[0], h:(p.amount/maxAmt*100).toFixed(1)+'%', amount:this.money(p.amount) })),\n      };\n\n      out.countryVisits='3,280'; out.countryDelta='2.84%';\n      out.topCountries=[\n        {flag:'🇺🇸', name:'United States', pct:'20%'},\n        {flag:'🇬🇧', name:'United Kingdom', pct:'12%'},\n        {flag:'🇨🇦', name:'Canada', pct:'9%'},\n        {flag:'🇧🇩', name:'Bangladesh', pct:'8%'},\n      ];\n    }\n\n    // INVENTORY\n    if(out.isInventory){\n      const q=(S.listQuery||'').toLowerCase();\n      const low=D.products.filter(p=>p.stock<=p.threshold);\n      const totalUnits=D.products.reduce((a,p)=>a+p.stock,0);\n      const stockValue=D.products.reduce((a,p)=>a+p.stock*p.cost,0);\n      out.invStats=[\n        {label:'Total SKUs',value:String(D.products.length),color:'var(--text)'},\n        {label:'Units in stock',value:totalUnits.toLocaleString(),color:'var(--text)'},\n        {label:'Stock value',value:this.money(stockValue),color:'var(--accent)'},\n        {label:'Low stock',value:String(low.length),color:'#dc2626'},\n      ];\n      out.lowOnly=S.lowOnly; out.toggleLow=()=>this.setState(s=>({lowOnly:!s.lowOnly}));\n      out.lowBtnBg=S.lowOnly?'rgba(245,158,11,.15)':'var(--surface)'; out.lowBtnColor=S.lowOnly?'#c2820a':'var(--text-dim)'; out.lowBtnBorder=S.lowOnly?'#f0b429':'var(--border)';\n      out.inventoryView=D.products.filter(p=>{ const okL=!S.lowOnly||p.stock<=p.threshold; return okL; }).map(p=>{\n        const lo=p.stock<=p.threshold, oo=p.stock===0;\n        return {...p, price:this.money(p.price),\n          stockColor:oo?'#dc2626':lo?'#c2820a':'var(--text)',\n          stockLabel:oo?'Out of stock':lo?'Low stock':'In stock',\n          badgeBg:oo?'rgba(239,68,68,.15)':lo?'rgba(245,158,11,.15)':'rgba(18,184,134,.15)',\n          badgeFg:oo?'#dc2626':lo?'#c2820a':'#0ca678',\n          restock:()=>{ this._data.products=this._data.products.map(x=>x.sku===p.sku?{...x,stock:x.stock+Math.max(50,x.threshold*3)}:x); this.forceUpdate(); } };\n      });\n    }\n\n    // REPORTS: P&L\n    if(out.isPL){\n      const grossSales=D.orders.filter(o=>o.status!=='Cancelled').reduce((a,o)=>a+o.total,0);\n      const salesReturns=D.orders.filter(o=>o.status==='Returned').reduce((a,o)=>a+o.total,0);\n      const netSales=grossSales-salesReturns;\n      const purchases=66000, purchaseReturns=6000, cogs=purchases-purchaseReturns;\n      const grossProfit=netSales-cogs;\n      const opex=[['Meta Ads',12000],['Salaries',30000],['Warehouse Rent',12000],['Software (SaaS)',4000]];\n      const totalOpex=opex.reduce((a,e)=>a+e[1],0);\n      const netProfit=grossProfit-totalOpex;\n      const R=[];\n      const head=(label)=>R.push({label,amount:'',size:'11.5px',weight:800,color:'var(--text-mute)',amtColor:'var(--text-mute)',tt:'uppercase',ls:'.05em',pad:'14px 0 6px',bg:'transparent',radius:'0',margin:'0',indent:'0'});\n      const line=(label,amount,neg)=>R.push({label,amount:(neg?'(':'')+this.money(amount,2)+(neg?')':''),size:'13.5px',weight:600,color:'var(--text-dim)',amtColor:neg?'#dc2626':'var(--text)',tt:'none',ls:'0',pad:'8px 0',bg:'transparent',radius:'0',margin:'0',indent:'16px'});\n      const total=(label,amount)=>R.push({label,amount:this.money(amount,2),size:'14px',weight:800,color:'var(--text)',amtColor:'var(--text)',tt:'none',ls:'0',pad:'12px 0',bg:'transparent',radius:'0',margin:'0',indent:'0'});\n      const hi=(label,amount,tint)=>R.push({label,amount:this.money(amount,2),size:'15px',weight:800,color:'var(--text)',amtColor:'var(--text)',tt:'none',ls:'0',pad:'14px 16px',bg:tint,radius:'12px',margin:'6px 0',indent:'0'});\n      head('Revenue'); line('Gross Sales',grossSales); line('Less: Sales Returns',salesReturns,true); total('Net Sales',netSales);\n      head('Cost of Goods Sold'); line('Purchases',purchases); line('Less: Purchase Returns',purchaseReturns,true); total('Net Purchases (COGS)',cogs);\n      hi('Gross Profit',grossProfit,'var(--surface-2)');\n      head('Operating Expenses'); opex.forEach(e=>line(e[0],e[1])); total('Total Operating Expenses',totalOpex);\n      hi('Net Profit / (Loss)',netProfit,'var(--accent-weak)');\n      out.pl={ netProfit:this.money(netProfit,2), grossProfit:this.money(grossProfit,2), period:'21 Jun 2026 – 20 Jul 2026', rows:R,\n        cards:[\n          {title:'Sales',icon:'shopping-cart-01',rows:[{k:'Total Sale',v:this.money(grossSales,2)},{k:'Total Sale Return',v:this.money(salesReturns,2)},{k:'Sale Payment',v:this.money(netSales*0.82,2)},{k:'Sale Due',v:this.money(netSales*0.18,2)}]},\n          {title:'Purchases',icon:'package',rows:[{k:'Total Purchase',v:this.money(purchases,2)},{k:'Total Purchase Return',v:this.money(purchaseReturns,2)},{k:'Purchase Payment',v:this.money(purchases*0.7,2)},{k:'Purchase Due',v:this.money(purchases*0.3,2)}]},\n          {title:'Expenses',icon:'wallet-01',rows:[{k:'Total Expenses',v:this.money(totalOpex,2)},{k:'Expenses Payment',v:this.money(totalOpex,2)},{k:'Expenses Due',v:this.money(0,2)}]},\n        ] };\n    }\n\n    // REPORTS: SALES\n    if(out.isSalesReport){\n      out.analyticsStats=[\n        {label:'Revenue',value:this.money(4128000),delta:'+12.4% ▲',deltaColor:'#0ca678'},\n        {label:'Orders',value:'1,084',delta:'+8.1% ▲',deltaColor:'#0ca678'},\n        {label:'Conversion',value:'3.2%',delta:'+0.4% ▲',deltaColor:'#0ca678'},\n        {label:'Refund rate',value:'1.8%',delta:'-0.3% ▼',deltaColor:'#0ca678'},\n      ];\n      const bv=[58,62,55,71,68,84,77], bmax=Math.max(...bv);\n      out.bars=bv.map((v,i)=>({h:(v/bmax*100).toFixed(0)+'%',label:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}));\n      const tp=[['Terra Sun Dress',1820000],['Faro Linen Shirt',1460000],['Arco Linen Blazer',1180000],['Nomad Overshirt',940000],['Halden Wide Trouser',720000]];\n      const tmax=tp[0][1];\n      out.topProducts=tp.map(([name,rev])=>({name,revenue:this.money(rev),w:(rev/tmax*100).toFixed(0)+'%'}));\n    }\n\n    // ACTIVITY\n    if(out.isActivity){\n      out.activity=[\n        {who:'Rafi Ahmed',what:'approved order #1041',when:'2 minutes ago',icon:'inbox'},\n        {who:'Nadia Karim',what:'added product “Arco Linen Blazer”',when:'1 hour ago',icon:'tag-01'},\n        {who:'System',what:'low stock alert for Coastal Knit Tee',when:'3 hours ago',icon:'alert-02'},\n        {who:'Amara Reyes',what:'created purchase PO-2041',when:'Yesterday',icon:'shopping-cart-01'},\n        {who:'Sami Rahman',what:'marked order #1039 In Transit',when:'Yesterday',icon:'delivery-truck-01'},\n        {who:'Rafi Ahmed',what:'recorded expense EXP-501',when:'2 days ago',icon:'wallet-01'},\n      ];\n    }\n\n    // STORE\n    if(out.isStore){\n      const st=S.store;\n      const themeAccents={Aria:'#5b4bd6',Slate:'#1f1f28',Bloom:'#e88b00',Fern:'#12b886'};\n      out.themes=[\n        {name:'Aria',swatch:'linear-gradient(135deg,#6a4be0,#8a8af0)'},\n        {name:'Slate',swatch:'linear-gradient(135deg,#1f1f28,#3a3a48)'},\n        {name:'Bloom',swatch:'linear-gradient(135deg,#e88b00,#f1641e)'},\n        {name:'Fern',swatch:'linear-gradient(135deg,#12b886,#0ea5a5)'},\n      ].map(t=>({...t, border:st.theme===t.name?'var(--accent)':'var(--border)', select:()=>this.setState(s=>({store:{...s.store,theme:t.name,accent:themeAccents[t.name]}})) }));\n      out.store={\n        pubLabel:st.published?'Published':'Draft', pubColor:st.published?'#12b886':'#c2820a',\n        pubBtn:st.published?'Unpublish':'Publish', pubBtnBg:st.published?'var(--surface-2)':'var(--accent)', pubBtnColor:st.published?'var(--text-dim)':'var(--accent-ink)',\n        deskBg:st.device==='desktop'?'var(--accent)':'transparent', deskColor:st.device==='desktop'?'var(--accent-ink)':'var(--text-dim)',\n        mobBg:st.device==='mobile'?'var(--accent)':'transparent', mobColor:st.device==='mobile'?'var(--accent-ink)':'var(--text-dim)',\n        previewW:st.device==='mobile'?'390px':'100%', previewAccent:st.accent,\n      };\n      out.togglePublish=()=>this.setState(s=>({store:{...s.store,published:!s.store.published}}));\n      out.setDesktop=()=>this.setState(s=>({store:{...s.store,device:'desktop'}}));\n      out.setMobile=()=>this.setState(s=>({store:{...s.store,device:'mobile'}}));\n      out.storeProducts=[{name:'Faro Linen Shirt',price:this.money(8800)},{name:'Terra Sun Dress',price:this.money(14200)},{name:'Nomad Overshirt',price:this.money(12800)}];\n    }\n\n    // DROPSHIP FIND\n    if(out.isDropFind){\n      const cat=[\n        {id:'a',name:'Aura LED Desk Lamp',supplier:'Shenzhen Glow Co.',cost:1400,price:3900},\n        {id:'b',name:'Terra Ceramic Planter',supplier:'Lisboa Homeware',cost:900,price:2400},\n        {id:'c',name:'Nomad Travel Pouch',supplier:'Bandung Textiles',cost:600,price:1500},\n        {id:'d',name:'Coastal Wave Diffuser',supplier:'Osaka Scents',cost:1800,price:4300},\n        {id:'e',name:'Meridian Wall Clock',supplier:'Krakow Timeworks',cost:1200,price:3000},\n        {id:'f',name:'Pebble Bluetooth Speaker',supplier:'Shenzhen Glow Co.',cost:2200,price:5400},\n      ];\n      out.dropCatalog=cat.map(d=>{ const imp=!!S.imported[d.id];\n        return {...d, cost:this.money(d.cost), margin:this.money(d.price-d.cost),\n          btnLabel:imp?'Imported ✓':'Import product',\n          btnBg:imp?'var(--surface-2)':'var(--accent)', btnColor:imp?'#0ca678':'var(--accent-ink)', btnBorder:imp?'var(--border)':'var(--accent)',\n          import:()=>this.setState(s=>({imported:{...s.imported,[d.id]:true}})) };\n      });\n      out.importedCount=String(Object.keys(S.imported).length);\n    }\n\n    // SETTINGS\n    if(out.isSettings){\n      const tabs=['General','Branding','Tax & Currency','Notifications','Security'];\n      out.settingsTabs=tabs.map(t=>({label:t, go:()=>this.setState({settingsTab:t}),\n        bg:S.settingsTab===t?'var(--accent)':'var(--surface)', color:S.settingsTab===t?'var(--accent-ink)':'var(--text-dim)', border:S.settingsTab===t?'var(--accent)':'var(--border)'}));\n      out.settingsTitle=S.settingsTab;\n      const set=(k)=>(e)=>this.setState(s=>({settings:{...s.settings,[k]:e.target.value}}));\n      const tog=(k)=>()=>this.setState(s=>({settings:{...s.settings,[k]:!s.settings[k]}}));\n      const inp=(label,k)=>({isInput:true,label,value:S.settings[k],onInput:set(k)});\n      const toggle=(label,k)=>({isToggle:true,label,tBg:S.settings[k]?'var(--accent)':'var(--surface-3)',tX:S.settings[k]?'23px':'3px',toggle:tog(k)});\n      const byTab={\n        'General':[inp('Store name','storeName'),inp('Support email','email'),inp('Phone','phone'),inp('Address','address')],\n        'Branding':[inp('Store name','storeName'),inp('Tagline','address')],\n        'Tax & Currency':[inp('Currency','currency'),inp('Default tax rate (%)','taxRate')],\n        'Notifications':[toggle('Low stock alerts','lowStockAlerts'),toggle('Order confirmation emails','orderEmails')],\n        'Security':[toggle('Two-factor authentication','twoFactor'),inp('Support email','email')],\n      };\n      out.settingsFields=byTab[S.settingsTab]||byTab['General'];\n    }\n\n    // ORDER DRAWER\n    const sel=D.orders.find(o=>o.id===S.selectedOrderId);\n    if(sel){\n      const st=this.statusStyle(sel.status);\n      const flow=['Pending','Approved','Ready To Ship','In Transit','Delivered'];\n      const idx=flow.indexOf(sel.status);\n      const terminal=sel.status==='Cancelled'||sel.status==='Returned'||sel.status==='Draft'||sel.status==='Send To Supplier';\n      out.hasOrder=true;\n      out.order={ ...sel, badgeBg:st.bg, badgeFg:st.fg, custInitials:this.initials(sel.customer),\n        subtotal:this.money(sel.subtotal), shipping:this.money(sel.shipping), tax:this.money(sel.tax), total:this.money(sel.total),\n        items:sel.items.map(it=>({...it, price:this.money(it.unit*it.qty)})),\n        pipeline:flow.map((label,i)=>({label, color:(!terminal&&i<=idx)?'var(--accent)':'var(--border)', text:(!terminal&&i<=idx)?'var(--accent)':'var(--text-mute)'})),\n        canAdvance:!terminal&&idx>=0&&idx<flow.length-1, nextLabel:(!terminal&&idx>=0&&idx<flow.length-1)?('Mark '+flow[idx+1]):'' };\n    } else out.hasOrder=false;\n    out.hasGeneric=!!S.selectedGeneric; out.generic=S.selectedGeneric;\n    out.closeGeneric=()=>this.setState({selectedGeneric:null});\n    out.closeOrder=()=>this.setState({selectedOrderId:null});\n    out.advanceOrder=()=>{ const flow=['Pending','Approved','Ready To Ship','In Transit','Delivered'];\n      this._data.orders=this._data.orders.map(o=>{ if(o.id!==S.selectedOrderId) return o; const i=flow.indexOf(o.status); return (i>=0&&i<flow.length-1)?{...o,status:flow[i+1]}:o; }); this.forceUpdate(); };\n\n    return out;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
